name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release -j 2

    # llama.cpp/ggml DLLs land in build/bin/Release; the executables need them
    # in the same directory to start.
    - name: Collect runtime DLLs
      shell: pwsh
      run: Copy-Item build/bin/Release/*.dll build/Release/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmoss-windows-x64
        path: build/Release/
